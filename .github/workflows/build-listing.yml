name: Build Repo Listing

env:
  listPublishDirectory: Website
  pathToCi: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source.json
      - Website/**
      - docs/images/overview-*.png
      - .github/workflows/build-listing.yml
  workflow_run:
    workflows:
      - Build Release
    types:
      - completed
  release:
    types:
      - published
      - created
      - edited
      - unpublished
      - deleted
      - released

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vpm-listing-pages
  cancel-in-progress: true

jobs:
  build-listing:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out VRChat package listing automation
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{ env.pathToCi }}
          clean: false

      - name: Restore listing build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Build VPM repository listing from all GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ${{ env.pathToCi }}/build.cmd BuildRepoListing \
            --root ${{ env.pathToCi }} \
            --list-publish-directory "$GITHUB_WORKSPACE/${{ env.listPublishDirectory }}"

      - name: Preserve the existing VCC repository URL
        shell: bash
        run: cp "${{ env.listPublishDirectory }}/index.json" "${{ env.listPublishDirectory }}/vpm.json"

      - name: Copy landing page images
        shell: bash
        run: |
          mkdir -p "${{ env.listPublishDirectory }}/assets"
          cp docs/images/overview-simple-mode-editor.png "${{ env.listPublishDirectory }}/assets/"
          cp docs/images/overview-gesture-manager-test.png "${{ env.listPublishDirectory }}/assets/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.listPublishDirectory }}

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
