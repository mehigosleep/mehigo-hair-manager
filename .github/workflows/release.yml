name: Build Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/release-trigger

permissions:
  contents: write

concurrency:
  group: vpm-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate package metadata
        id: package
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const required = ['name', 'displayName', 'version', 'url', 'author'];
          const missing = required.filter((key) => !manifest[key]);

          if (missing.length > 0) {
            throw new Error(`package.json is missing required fields: ${missing.join(', ')}`);
          }

          if (!manifest.author.name || !manifest.author.email) {
            throw new Error('package.json author.name and author.email are required.');
          }

          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(manifest.version)) {
            throw new Error(`package.json version is not valid SemVer: ${manifest.version}`);
          }

          const tag = `v${manifest.version}`;
          const asset = `${manifest.name}-${manifest.version}.zip`;
          const expectedUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${asset}`;

          if (manifest.url !== expectedUrl) {
            throw new Error(`package.json url must be ${expectedUrl}`);
          }

          const output = [
            `version=${manifest.version}`,
            `name=${manifest.name}`,
            `tag=${tag}`,
            `asset=${asset}`
          ].join('\n') + '\n';

          fs.appendFileSync(process.env.GITHUB_OUTPUT, output);
          NODE

      - name: Refuse to overwrite an existing version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Increase package.json version before publishing."
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Increase package.json version before publishing."
            exit 1
          fi

      - name: Build VPM package ZIP
        env:
          ASSET_NAME: ${{ steps.package.outputs.asset }}
        shell: bash
        run: |
          package_files=(
            Editor
            Editor.meta
            package.json
            README.md
            README.md.meta
            CHANGELOG.md
            CHANGELOG.md.meta
            LICENSE.md
            LICENSE.md.meta
          )

          for path in "${package_files[@]}"; do
            if [ ! -e "${path}" ]; then
              echo "Required package path is missing: ${path}"
              exit 1
            fi
          done

          mkdir -p build/package
          cp -R "${package_files[@]}" build/package/
          cd build/package
          zip -r -X "../${ASSET_NAME}" .

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ASSET_NAME: ${{ steps.package.outputs.asset }}
        shell: bash
        run: |
          gh release create "${TAG}" \
            "build/${ASSET_NAME}" \
            package.json \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file CHANGELOG.md
